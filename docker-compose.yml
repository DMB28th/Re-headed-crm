services:
  # Single-box deploy: both apps share ./data (the file-backed config store).
  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./data:/data

  studio:
    build:
      context: .
      dockerfile: apps/studio/Dockerfile
    ports:
      - "3002:3002"
    volumes:
      - ./data:/data

  # Postgres-backed AdminConfigStore + audit log. Opt in with
  # `docker compose --profile db up`, then set DATABASE_URL on both services;
  # the schema is created and the demo tenant seeded on first boot.
  postgres:
    image: postgres:16-alpine
    profiles: ["db"]
    environment:
      POSTGRES_USER: cardstack
      POSTGRES_PASSWORD: cardstack
      POSTGRES_DB: cardstack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

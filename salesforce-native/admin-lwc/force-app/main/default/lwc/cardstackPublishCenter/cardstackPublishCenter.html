<template>
    <div class="slds-p-around_small">
        <div class="slds-grid slds-gutters slds-m-bottom_medium">
            <div class="slds-col slds-size_1-of-4">
                <lightning-combobox
                    label="Status"
                    options={statusOptions}
                    value={statusFilter}
                    onchange={handleStatusChange}>
                </lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-4 slds-m-top_large">
                <lightning-button
                    label="Refresh"
                    icon-name="utility:refresh"
                    onclick={refresh}>
                </lightning-button>
            </div>
        </div>

        <template if:true={drafts.length}>
            <lightning-datatable
                key-field="Id"
                data={drafts}
                columns={columns}
                hide-checkbox-column>
            </lightning-datatable>

            <h3 class="slds-text-heading_small slds-m-top_medium slds-m-bottom_small">
                Pending drafts
            </h3>
            <template for:each={pendingDrafts} for:item="d">
                <div key={d.Id} class="slds-box slds-m-bottom_small">
                    <div class="slds-grid slds-grid_align-spread">
                        <div>
                            <p class="slds-text-heading_small">{d.Name} — {d.configKey}</p>
                            <p class="slds-text-color_weak slds-text-body_small">
                                Created {d.created} by {d.createdBy}
                            </p>
                        </div>
                        <div>
                            <lightning-button
                                label="Publish"
                                variant="brand"
                                data-id={d.Id}
                                onclick={publish}
                                class="slds-m-right_x-small">
                            </lightning-button>
                            <lightning-button
                                label="Roll Back"
                                variant="destructive-text"
                                data-id={d.Id}
                                onclick={askRollback}>
                            </lightning-button>
                        </div>
                    </div>
                    <lightning-textarea
                        label="Draft value (read-only)"
                        value={d.prettyValue}
                        readonly
                        class="slds-m-top_small json-editor">
                    </lightning-textarea>
                </div>
            </template>
        </template>
        <template if:false={drafts.length}>
            <p class="slds-text-color_weak">No drafts found. Stage changes from any Studio section first.</p>
        </template>

        <!-- Rollback confirm -->
        <template if:true={confirmRollbackId}>
            <section class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <div class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Roll back draft?</h2>
                    </div>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p>The draft will be discarded. The live config is untouched.</p>
                    </div>
                    <div class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={cancelRollback} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button label="Roll Back" variant="destructive" onclick={rollback}></lightning-button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </div>
</template>

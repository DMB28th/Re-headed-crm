<template>
    <template if:true={hasSteps}><section class="slds-box slds-m-bottom_small" aria-label="Card authoring readiness"><p class="slds-text-title_bold">Authoring steps</p><p class="slds-text-color_weak slds-m-bottom_small">Checks describe this admin’s configuration and metadata. Actual chat access must be tested.</p><ol class="slds-grid slds-wrap slds-gutters_small"><template for:each={steps} for:item="step"><li key={step.key} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small"><lightning-button label={step.label} data-key={step.key} onclick={navigate}></lightning-button><p>{step.message}</p><span class="slds-text-color_weak">{step.status}</span></li></template></ol></section></template>
    <template if:true={hasPublishedContext}><section class="slds-box slds-m-bottom_small" aria-label="Manual post-publication test"><h2 class="slds-text-heading_small">Test the published card in chat</h2><p class="slds-text-color_weak">{contextLabel}</p><p class="slds-m-top_small">{manualTestInstructions}</p><details class="slds-m-top_small"><summary>Optional disposable edit test</summary><p>{governedEditInstructions}</p></details></section></template>
</template>

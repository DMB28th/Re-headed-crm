<template>
    <div class="slds-p-around_small">
        <div class="slds-grid slds-grid_align-spread slds-m-bottom_medium">
            <div class="slds-grid slds-gutters">
                <div class="slds-col">
                    <lightning-combobox
                        label="Status"
                        options={statusOptions}
                        value={statusFilter}
                        disabled={busy}
                        onchange={handleStatusChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-m-top_large">
                    <lightning-button
                        label="Refresh"
                        icon-name="utility:refresh"
                        onclick={handleRefresh}
                        disabled={busy}>
                    </lightning-button>
                </div>
            </div>
            <div class="slds-m-top_large">
                <template if:true={hasPendingDrafts}>
                    <lightning-button
                        label={publishSelectedLabel}
                        variant="brand"
                        icon-name="utility:publish"
                        onclick={publishSelected}
                        disabled={selectionDisabled}>
                    </lightning-button>
                </template>
            </div>
        </div>

        <template lwc:if={busy}><lightning-spinner size="small" alternative-text="Reviewing or publishing selected drafts"></lightning-spinner></template>
        <template lwc:if={persistentError}><p role="alert" class="slds-text-color_error slds-m-bottom_small">{persistentError}</p></template>
        <template for:each={resultRows} for:item="result"><p key={result.draftId} role="status" class="slds-m-bottom_small">{result.text}</p></template>
        <p class="slds-text-color_weak slds-m-bottom_small">This is a bounded draft window. Select the specific drafts to publish. Refresh to load more after publication. Each draft publishes separately.</p>
        <template if:true={pendingDrafts.length}>
            <h3 class="slds-text-heading_small slds-m-bottom_small">
                Pending drafts ({pendingDrafts.length})
            </h3>
            <template for:each={pendingDrafts} for:item="d">
                <div key={d.Id} class="slds-box slds-m-bottom_small">
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <div>
                            <lightning-input type="checkbox" label={d.label} checked={d.selected} disabled={d.reviewDisabled} data-id={d.Id} onchange={handleSelection}></lightning-input>
                            <p class="slds-text-heading_small">{d.label}</p>
                            <p class="slds-text-color_weak slds-text-body_small">
                                <span class="draft-age">{d.ageText}</span>
                                <template if:true={d.createdBy}> by {d.createdBy}</template>
                                · <span class="slds-text-title">{d.configKey}</span> · Draft {d.Id}
                            </p>
                        </div>
                        <div>
                            <lightning-button
                                label="Review and publish"
                                data-review="true"
                                disabled={d.reviewDisabled}
                                variant="brand"
                                data-id={d.Id}
                                onclick={publish}
                                class="slds-m-right_x-small">
                            </lightning-button>
                            <lightning-button
                                label="Discard draft"
                                disabled={d.reviewDisabled}
                                variant="destructive-text"
                                data-id={d.Id}
                                onclick={askRollback}>
                            </lightning-button>
                        </div>
                    </div>

                    <!-- Visual diff summary -->
                    <template if:true={d.diffSummary}>
                        <div class="slds-m-top_small diff-summary">
                            <template for:each={d.diffSummary} for:item="line">
                                <p key={line.key} class={line.cssClass}>
                                    <lightning-icon icon-name={line.icon} size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                    {line.text}
                                </p>
                            </template>
                        </div>
                    </template>
                    <template if:true={d.diffLoading}>
                        <p class="slds-text-color_weak slds-m-top_small">
                            <lightning-spinner size="small" alternative-text="Loading diff"></lightning-spinner>
                            Comparing with live…
                        </p>
                    </template>

                    <!-- Collapsible raw JSON -->
                    <div class="slds-m-top_small">
                        <lightning-button
                            label={d.jsonToggleLabel}
                            variant="base"
                            icon-name={d.jsonToggleIcon}
                            data-id={d.Id}
                            onclick={toggleJson}>
                        </lightning-button>
                        <template if:true={d.showJson}>
                            <lightning-textarea
                                label="Draft raw JSON"
                                value={d.prettyValue}
                                readonly
                                class="slds-m-top_x-small json-editor">
                            </lightning-textarea>
                            <lightning-textarea label="Published raw JSON" value={d.prettyLiveValue} readonly class="slds-m-top_x-small json-editor"></lightning-textarea>
                        </template>
                    </div>
                </div>
            </template>
        </template>

        <template if:true={retainedDrafts.length}>
            <h3 class="slds-text-heading_small slds-m-top_medium slds-m-bottom_small">Retained drafts ({retainedDrafts.length})</h3>
            <p class="slds-text-color_weak slds-m-bottom_small">These configurations are no longer supported for Studio publication. Inspect the saved values or discard the draft; existing live values and history remain.</p>
            <template for:each={retainedDrafts} for:item="d">
                <div key={d.Id} class="slds-box slds-m-bottom_small">
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <div><p class="slds-text-heading_small">{d.label}</p><p class="slds-text-color_weak">{d.configKey} · Draft {d.Id}</p></div>
                        <lightning-button label="Discard draft" variant="destructive-text" disabled={d.reviewDisabled} data-id={d.Id} onclick={askRollback}></lightning-button>
                    </div>
                    <lightning-button label={d.jsonToggleLabel} variant="base" icon-name={d.jsonToggleIcon} data-id={d.Id} onclick={toggleJson}></lightning-button>
                    <template if:true={d.showJson}><lightning-textarea label="Retained raw JSON" value={d.prettyValue} readonly></lightning-textarea></template>
                </div>
            </template>
        </template>

        <template if:true={otherDrafts.length}>
            <h3 class="slds-text-heading_small slds-m-top_medium slds-m-bottom_small">
                History
            </h3>
            <lightning-datatable
                key-field="Id"
                data={otherDrafts}
                columns={columns}
                hide-checkbox-column>
            </lightning-datatable>
        </template>

        <template if:false={drafts.length}>
            <p class="slds-text-color_weak">No drafts found. Stage changes from any Studio section first.</p>
        </template>

    </div>
</template>

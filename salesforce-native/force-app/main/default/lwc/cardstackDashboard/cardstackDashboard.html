<template>
    <div class="overview slds-p-around_medium">
        <template if:true={data}>
            <div class="org-context slds-m-bottom_medium">
                <div><p class="slds-text-title_caps">{orgContextLabel}</p><p>{org.orgName} · {org.userName}</p><p class="slds-text-body_small slds-text-color_weak">{org.orgId}</p></div>
                <lightning-button label="Open Setup" variant="base" onclick={goToSetup}></lightning-button>
            </div>
            <div class="next-action slds-box slds-m-bottom_medium">
                <p>{nextAction.description}</p><lightning-button label={nextAction.label} variant="brand" onclick={handleNextAction}></lightning-button>
            </div>
            <div class="summary-grid">
                <section class="slds-box" aria-label="Record card states">
                    <h2 class="slds-text-heading_small slds-m-bottom_small">Record cards</h2>
                    <lightning-button label="Configure another object" variant="base" onclick={configureAnother}></lightning-button>
                    <ul class="slds-has-dividers_bottom-space"><template for:each={objectRows} for:item="object"><li key={object.objectApi} class="summary-row slds-item">
                        <div><p>{object.label}</p><p class="slds-text-body_small slds-text-color_weak">{object.objectApi} · {object.status}</p></div>
                        <lightning-button label="Open card" variant="base" data-object={object.objectApi} onclick={openObject} disabled={object.unavailable}></lightning-button>
                    </li></template></ul>
                    <template if:false={objectRows.length}><p class="slds-text-color_weak">No record objects are available to configure.</p></template>
                </section>
                <section class="slds-box" aria-label="Pending drafts">
                    <h2 class="slds-text-heading_small slds-m-bottom_small">Pending drafts · {pendingDraftCount}</h2>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">{draftSummary}</p>
                    <ul><template for:each={pendingDrafts} for:item="draft"><li key={draft.id} class="summary-row">
                        <div><p>{draft.label}</p><p class="slds-text-body_small slds-text-color_weak">{draft.key}</p></div><lightning-button label="Review draft" variant="base" data-id={draft.id} onclick={openDraft}></lightning-button>
                    </li></template></ul>
                    <lightning-button label="Review &amp; Publish" variant="base" onclick={goToPublish}></lightning-button>
                </section>
            </div>
            <section class="slds-box slds-m-top_medium" aria-label="Recent activity">
                <div class="summary-row slds-m-bottom_small"><h2 class="slds-text-heading_small">Recent activity</h2><lightning-button label="View Activity" variant="base" onclick={goToAudit}></lightning-button></div>
                <template if:true={recentActivity.length}><lightning-datatable key-field="key" data={recentActivity} columns={activityColumns} hide-checkbox-column></lightning-datatable></template>
                <template if:false={recentActivity.length}><p class="slds-text-color_weak">No recent tool activity.</p></template>
            </section>
        </template>
        <template if:true={error}><p role="alert" class="slds-text-color_error">{error}</p></template>
        <template if:false={data}><template if:false={error}><lightning-spinner alternative-text="Loading Overview" size="small"></lightning-spinner></template></template>
    </div>
</template>

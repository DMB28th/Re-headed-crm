<template>
    <div class="slds-p-around_small">
        <div class="slds-grid slds-gutters slds-m-bottom_medium">
            <div class="slds-col slds-size_1-of-3">
                <div class="obj-picker">
                    <label class="slds-form-element__label" for="obj-search">CRM Object</label>
                    <template if:false={selectedObject}>
                        <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_right">
                            <lightning-icon icon-name="utility:search" size="x-small" class="slds-input__icon slds-input__icon_right"></lightning-icon>
                            <input
                                id="obj-search"
                                type="text"
                                class="slds-input"
                                placeholder="Type to search objects…"
                                value={objectSearch}
                                oninput={handleObjectSearch}
                                onfocus={handleObjectFocus}
                                onblur={handleObjectBlur}
                                onkeydown={handleObjectKeydown}
                                autocomplete="off" />
                        </div>
                        <template if:true={objectDropdownOpen}>
                            <div class="obj-dropdown">
                                <template if:true={objectsLoading}>
                                    <div class="slds-p-around_small slds-align_absolute-center">
                                        <lightning-spinner size="small" alternative-text="Loading objects"></lightning-spinner>
                                    </div>
                                </template>
                                <template if:true={objectsLoadError}>
                                    <p class="slds-p-around_small slds-text-color_error">Couldn't load objects. Try refreshing.</p>
                                </template>
                                <template if:false={objectsLoading}>
                                    <ul>
                                        <template for:each={filteredObjects} for:item="o">
                                            <li key={o.value}
                                                data-value={o.value}
                                                onmousedown={handleObjectSelect}
                                                class="obj-option">
                                                <span class="slds-truncate"><strong>{o.label}</strong></span>
                                            </li>
                                        </template>
                                    </ul>
                                    <template if:false={filteredObjects.length}>
                                        <p class="slds-p-around_small slds-text-color_weak">No objects match "{objectSearch}".</p>
                                    </template>
                                </template>
                            </div>
                        </template>
                    </template>
                    <template if:true={selectedObject}>
                        <div class="slds-box slds-box_xx-small slds-grid slds-grid_align-spread slds-grid_vertical-align-center obj-selected">
                            <span class="slds-truncate"><strong>{selectedObjectLabel}</strong></span>
                            <lightning-button-icon
                                icon-name="utility:close"
                                variant="bare"
                                size="small"
                                alternative-text="Change object"
                                title="Change object"
                                onclick={handleClearObject}>
                            </lightning-button-icon>
                        </div>
                    </template>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-3">
                <lightning-combobox
                    label="Audience"
                    options={audienceOptions}
                    value={audience}
                    onchange={handleAudienceChange}>
                </lightning-combobox>
            </div>
        </div>

        <template if:true={selectedObject}>
            <lightning-tabset variant="scoped">

                <!-- ================= LAYOUTS: sections builder ================= -->
                <lightning-tab label="Layouts" value="layouts">
                    <div class="slds-m-top_small slds-m-bottom_small">
                        <p class="slds-text-color_weak slds-m-bottom_x-small">
                            Record card layout for {selectedObjectLabel}. Add highlight fields,
                            organize the rest into sections, then stage the draft.
                        </p>
                        <lightning-badge label={layoutStatusLabel} class={layoutStatusClass}></lightning-badge>
                        <template if:true={isDirty}>
                            <lightning-badge label="Unsaved changes" class="slds-badge slds-theme_warning slds-m-left_x-small"></lightning-badge>
                        </template>
                        <template if:true={hasInvalidFields}>
                            <lightning-badge label={invalidCountText} class="slds-badge slds-theme_error slds-m-left_x-small"></lightning-badge>
                        </template>
                    </div>

                    <div class="builder-toolbar">
                        <div><strong>Layout editor</strong><p>Drag fields into the card. Choose columns for each section.</p></div>
                        <div class="toolbar-actions">
                            <lightning-button label="Add section" icon-name="utility:add" onclick={handleAddSection}></lightning-button>
                            <lightning-button label={previewToggleLabel} icon-name="utility:preview" onclick={togglePreview}></lightning-button>
                            <lightning-button label="Stage Draft" variant="brand" onclick={stageLayout} disabled={cannotStage}></lightning-button>
                        </div>
                    </div>
                    <div class="field-palette">
                        <div class="palette-header">
                            <h3>Fields</h3>
                            <lightning-input type="search" label="Search fields" variant="label-hidden" placeholder="Quick find fields…" value={fieldSearch} onchange={handleFieldSearch}></lightning-input>
                            <lightning-combobox label="Add fields to section" variant="label-hidden" placeholder="Choose section" options={sectionTargetOptions} value={targetSectionKey} onchange={handleTargetSectionChange}></lightning-combobox>
                        </div>
                        <p class="palette-hint">Drag a field to Highlights or a column below. Use + to add to the selected section.</p>
                        <template if:true={fieldsLoading}><lightning-spinner size="small" alternative-text="Loading fields"></lightning-spinner></template>
                        <ul class="palette-grid">
                            <template for:each={paletteFields} for:item="f">
                                <li key={f.api} class={f.paletteClass} draggable={f.draggable} data-api={f.api} ondragstart={handleDragStart} ondragend={handleDragEnd} title={f.api}>
                                    <span class="palette-name">{f.label}</span>
                                    <template if:true={f.added}><lightning-icon icon-name="utility:check" size="xx-small" alternative-text="In layout"></lightning-icon></template>
                                    <template if:false={f.added}><lightning-button-icon icon-name="utility:add" variant="bare" size="small" alternative-text="Add field" title="Add to selected section" data-api={f.api} onclick={handleAddFieldClick}></lightning-button-icon></template>
                                </li>
                            </template>
                        </ul>
                        <template if:false={paletteFields.length}><p class="palette-hint">No fields match your search.</p></template>
                    </div>
                    <div class="layout-canvas" ondragend={handleDragEnd}>
                        <div class="canvas-record-header"><lightning-icon icon-name="standard:record" size="small"></lightning-icon><div><strong>{selectedObjectLabel}</strong><p>Record card</p></div></div>
                        <section class="highlights-section">
                            <div class="canvas-section-heading"><h3>Highlights Panel</h3><span>Up to 7 key fields</span></div>
                            <div class="highlight-dropzone" data-section="highlights" ondragover={handleDragOver} ondragleave={handleDragLeave} ondrop={handleDrop}>
                                <template for:each={workingHighlights} for:item="h">
                                    <span key={h.key} class={h.rowClass} draggable="true" data-key={h.key} data-section="highlights" ondragstart={handleDragStart} ondragover={handleDragOver} ondragleave={handleDragLeave} ondrop={handleDrop}>
                                        <lightning-icon icon-name="utility:drag" size="xx-small"></lightning-icon><strong>{h.label}</strong>
                                        <lightning-button-icon icon-name="utility:close" variant="bare" size="x-small" alternative-text="Remove highlight" data-key={h.key} onclick={handleRemoveHighlight}></lightning-button-icon>
                                    </span>
                                </template>
                                <span class="drop-hint">Drop a highlight field here</span>
                            </div>
                            <template if:false={highlightsFull}><lightning-combobox label="Add highlight field" variant="label-hidden" placeholder="Add a highlight field…" options={highlightFieldOptions} value="" onchange={handleAddHighlight} class="hl-add"></lightning-combobox></template>
                        </section>
                        <template for:each={sectionViews} for:item="s">
                            <section key={s.key} class="section-card">
                                <div class="canvas-section-heading">
                                    <lightning-input label="Section label" variant="label-hidden" value={s.label} data-key={s.key} onchange={handleSectionLabelChange} class="section-label-input" placeholder="Section label"></lightning-input>
                                    <lightning-combobox label="Section columns" variant="label-hidden" value={s.columnValue} options={sectionColumnOptions} data-key={s.key} onchange={handleSectionColumnsChange} class="section-columns"></lightning-combobox>
                                    <lightning-button-icon icon-name="utility:delete" variant="bare" alternative-text="Remove section" title="Remove section" data-key={s.key} onclick={handleRemoveSection}></lightning-button-icon>
                                </div>
                                <template if:true={s.hasMultipleColumns}>
                                    <div class="column-dropzone full-width-zone" data-section={s.key} data-column="full" ondragover={handleDragOver} ondragleave={handleDragLeave} ondrop={handleDrop}>
                                        <p class="column-heading">Full width</p>
                                        <template for:each={s.fullFields} for:item="f">
                                            <div key={f.key} class={f.rowClass} draggable="true" data-key={f.key} data-section={s.key} data-column="full" ondragstart={handleDragStart} ondragover={handleDragOver} ondragleave={handleDragLeave} ondrop={handleDrop}>
                                                <c-cardstack-layout-field field={f} section-key={s.key} column-count={s.columns} move-options={s.moveOptions} onfieldedit={handleFieldEdit}></c-cardstack-layout-field>
                                            </div>
                                        </template>
                                        <span class="drop-hint">Drop full-width fields here</span>
                                    </div>
                                </template>
                                <div class={s.gridClass}>
                                    <template for:each={s.columnViews} for:item="col">
                                        <div key={col.key} class="column-dropzone" data-section={s.key} data-column={col.key} ondragover={handleDragOver} ondragleave={handleDragLeave} ondrop={handleDrop}>
                                            <p class="column-heading">{col.label}</p>
                                            <template for:each={col.fields} for:item="f">
                                                <div key={f.key} class={f.rowClass} draggable="true" data-key={f.key} data-section={s.key} data-column={col.key} ondragstart={handleDragStart} ondragover={handleDragOver} ondragleave={handleDragLeave} ondrop={handleDrop}>
                                                    <c-cardstack-layout-field field={f} section-key={s.key} column-count={s.columns} move-options={s.moveOptions} onfieldedit={handleFieldEdit}></c-cardstack-layout-field>
                                                </div>
                                            </template>
                                            <span class="drop-hint">Drop fields here</span>
                                        </div>
                                    </template>
                                </div>
                            </section>
                        </template>
                        <button class="add-section-btn" onclick={handleAddSection}><lightning-icon icon-name="utility:add" size="x-small"></lightning-icon> Add section</button>
                    </div>
                    <template if:true={showPreview}>
                        <div class="preview-panel">
                            <div class="canvas-section-heading"><h3>Card preview</h3><lightning-combobox label="View as" variant="label-hidden" options={previewAudienceOptions} value={previewAudience} onchange={handlePreviewAudienceChange} class="preview-audience"></lightning-combobox></div>
                            <div class="mock-card">
                                <h3>Sample Record Name</h3><p class="slds-text-color_weak">{selectedObjectLabel}</p>
                                <template if:true={previewHasHighlights}><div class="preview-highlights"><template for:each={previewHighlightRows} for:item="h"><div key={h.key} class="ph-item"><p>{h.label}</p><strong>{h.sample.value}</strong></div></template></div></template>
                                <template for:each={previewSectionViews} for:item="sec">
                                    <section key={sec.key} class="preview-section"><h4>{sec.label}</h4>
                                        <template for:each={sec.fullRows} for:item="r"><div key={r.key} class="preview-cell"><p>{r.label}</p><span>{r.sample.value}</span></div></template>
                                        <template if:true={sec.usesColumns}><div class={sec.gridClass}><template for:each={sec.columnViews} for:item="col"><div key={col.key}><template for:each={col.rows} for:item="r"><div key={r.key} class="preview-cell"><p>{r.label}</p><span>{r.sample.value}</span></div></template></div></template></div></template>
                                        <template if:false={sec.hasRows}><p class="slds-text-color_weak">No fields in this section.</p></template>
                                    </section>
                                </template>
                                <template if:true={previewIsEmpty}><p>Nothing to preview.</p></template>
                                <div class="slds-text-align_right slds-m-top_medium"><lightning-button label="Open in Salesforce" variant="brand" disabled></lightning-button></div>
                            </div>
                            <p class="slds-text-color_weak slds-m-top_small">Sample values preview your card layout. Published layouts determine what appears in chat.</p>
                        </div>
                    </template>

                    <!-- Advanced: diff + JSON (collapsed by default) -->
                    <div class="slds-m-top_medium">
                        <lightning-button
                            label={advancedToggleLabel}
                            variant="base"
                            icon-name="utility:settings"
                            onclick={toggleAdvanced}>
                        </lightning-button>
                        <template if:true={showAdvanced}>
                            <div class="slds-box slds-m-top_small slds-theme_shade">
                                <lightning-button
                                    label={diffToggleLabel}
                                    variant="base"
                                    icon-name="utility:preview"
                                    onclick={toggleDiff}>
                                </lightning-button>
                                <template if:true={showDiff}>
                                    <div class="slds-box slds-m-top_small slds-theme_default">
                                        <template if:true={diff.hasLive}>
                                            <template if:true={diff.empty}>
                                                <p class="slds-text-color_weak">No differences — working copy matches the published layout.</p>
                                            </template>
                                            <template if:true={diff.structureChanged}><p class="diff-moved">Section layout or field settings changed. View JSON for the exact configuration.</p></template>
                                            <template for:each={diff.hlAdded} for:item="h">
                                                <p key={h.key} class="diff-added">+ highlight: {h.label} <span class="mono">({h.api})</span></p>
                                            </template>
                                            <template for:each={diff.hlRemoved} for:item="h">
                                                <p key={h.key} class="diff-removed">− highlight: {h.label} <span class="mono">({h.api})</span></p>
                                            </template>
                                            <template for:each={diff.added} for:item="f">
                                                <p key={f.key} class="diff-added">+ {f.label} <span class="mono">({f.api})</span></p>
                                            </template>
                                            <template for:each={diff.removed} for:item="f">
                                                <p key={f.key} class="diff-removed">− {f.label} <span class="mono">({f.api})</span></p>
                                            </template>
                                            <template for:each={diff.moved} for:item="f">
                                                <p key={f.key} class="diff-moved">⇅ {f.label} <span class="mono">moved {f.from} → {f.to}</span></p>
                                            </template>
                                        </template>
                                        <template if:false={diff.hasLive}>
                                            <p>New layout — {totalFieldCount} field(s), nothing published yet.</p>
                                        </template>
                                    </div>
                                </template>
                                <div class="slds-m-top_small">
                                    <lightning-button
                                        label={jsonToggleLabel}
                                        variant="base"
                                        icon-name="utility:code"
                                        onclick={toggleJson}>
                                    </lightning-button>
                                    <template if:true={showJson}>
                                        <div class="slds-m-top_small">
                                            <pre class="json-box slds-box">{generatedJson}</pre>
                                            <lightning-button label="Copy JSON" variant="neutral" icon-name="utility:copy" onclick={copyJson} class="slds-m-top_x-small"></lightning-button>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Stage bar -->
                    <div class="slds-m-top_medium slds-p-top_small stage-bar">
                        <lightning-button
                            label="Stage Draft"
                            variant="brand"
                            onclick={stageLayout}
                            disabled={cannotStage}
                            class="slds-m-right_x-small">
                        </lightning-button>
                        <lightning-button label="Revert to live" onclick={revertToLive}></lightning-button>
                        <template if:true={hasInvalidFields}>
                            <p class="slds-text-color_error slds-m-top_x-small">Fix the highlighted fields before staging.</p>
                        </template>
                    </div>
                </lightning-tab>

                <!-- ================= LISTS (unchanged) ================= -->
                <lightning-tab label="Lists" value="lists">
                    <div class="slds-m-top_small">
                        <p class="slds-text-color_weak slds-m-bottom_small">
                            Chat list views and exposures for {selectedObjectLabel}.
                        </p>
                        <template if:true={staging.lists}>
                            <lightning-badge
                                label={listsStatusLabel}
                                class={listsStatusClass}>
                            </lightning-badge>
                        </template>
                        <lightning-textarea
                            label="Lists JSON (draft)"
                            value={draftValues.lists}
                            onchange={handleDraftEdit}
                            data-key="lists"
                            class="slds-m-top_small json-editor">
                        </lightning-textarea>
                        <div class="slds-m-top_small">
                            <lightning-button
                                label="Stage Draft"
                                variant="brand"
                                onclick={stageLists}
                                class="slds-m-right_x-small">
                            </lightning-button>
                            <lightning-button
                                label="Load Live"
                                onclick={loadLiveLists}>
                            </lightning-button>
                        </div>
                    </div>
                </lightning-tab>

                <!-- ================= ACTIONS (visual) ================= -->
                <lightning-tab label="Actions" value="actions">
                    <div class="slds-m-top_small">
                        <p class="slds-text-color_weak slds-m-bottom_small">
                            Card actions for {selectedObjectLabel}. Toggle them on/off, add new ones,
                            or remove them — changes are staged as a layout draft.
                        </p>
                        <template if:true={actionToggles.length}>
                            <lightning-datatable
                                key-field="name"
                                data={actionToggles}
                                columns={actionColumns}
                                onsave={handleActionToggleSave}
                                onrowaction={handleActionRowAction}
                                draft-values={actionDraftValues}>
                            </lightning-datatable>
                        </template>
                        <template if:false={actionToggles.length}>
                            <p class="slds-text-color_weak slds-m-bottom_small">
                                No actions yet. Add the first one below.
                            </p>
                        </template>
                        <div class="slds-box slds-m-top_medium">
                            <h3 class="slds-text-heading_small slds-m-bottom_small">Add action</h3>
                            <div class="slds-grid slds-gutters">
                                <div class="slds-col slds-size_1-of-4">
                                    <lightning-input label="Label" value={newAction.label} data-field="label" onchange={handleNewActionInput}></lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-4">
                                    <lightning-input label="Name (optional)" value={newAction.name} data-field="name" onchange={handleNewActionInput}></lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-4">
                                    <lightning-combobox label="Type" options={newActionTypeOptions} value={newAction.type} data-field="type" onchange={handleNewActionInput}></lightning-combobox>
                                </div>
                                <div class="slds-col slds-size_1-of-4">
                                    <lightning-input label="Description" value={newAction.description} data-field="description" onchange={handleNewActionInput}></lightning-input>
                                </div>
                            </div>
                            <lightning-button label="Add action" variant="brand" onclick={addAction} class="slds-m-top_small"></lightning-button>
                        </div>
                    </div>
                </lightning-tab>

                <!-- ================= ASSIGNMENT (unchanged) ================= -->
                <lightning-tab label="Assignment" value="assignment">
                    <div class="slds-m-top_small">
                        <p class="slds-text-color_weak slds-m-bottom_small">
                            Who sees which layout. Audiences map to layout keys; the default
                            audience applies to everyone.
                        </p>
                        <lightning-datatable
                            key-field="audience"
                            data={assignmentRows}
                            columns={assignmentColumns}>
                        </lightning-datatable>
                        <div class="slds-m-top_small">
                            <lightning-input
                                label="New audience name"
                                value={newAudience}
                                onchange={handleNewAudienceInput}
                                class="slds-m-bottom_small">
                            </lightning-input>
                            <lightning-button
                                label="Add Audience"
                                variant="brand"
                                onclick={addAudience}>
                            </lightning-button>
                        </div>
                    </div>
                </lightning-tab>

                <!-- ================= PERMISSIONS (unchanged) ================= -->
                <lightning-tab label="Permissions" value="permissions">
                    <div class="slds-m-top_small">
                        <p class="slds-text-color_weak slds-m-bottom_small">
                            Allow chat edits for {selectedObjectLabel} only after publishing.
                            Each field must also have editing enabled in the layout.
                            Read-only fields and the denylist remain protected; Salesforce access still applies.
                        </p>
                        <template if:true={permissions}>
                            <lightning-input
                                type="toggle"
                                label="Writes from chat enabled"
                                checked={permissions.writeEnabled}
                                onchange={handleWriteToggle}>
                            </lightning-input>
                            <lightning-textarea
                                label="Field denylist (one API name per line)"
                                value={denylistText}
                                onchange={handleDenylistEdit}
                                class="slds-m-top_small">
                            </lightning-textarea>
                            <lightning-button
                                label="Stage Permissions"
                                variant="brand"
                                onclick={stagePermissions}
                                class="slds-m-top_small">
                            </lightning-button>
                        </template>
                        <template if:false={permissions}>
                            <p class="slds-text-color_weak">
                                No permissions block in the live layout yet.
                            </p>
                        </template>
                    </div>
                </lightning-tab>
            </lightning-tabset>
        </template>

        <template if:false={selectedObject}>
            <div class="slds-illustration slds-illustration_small slds-m-top_large">
                <p class="slds-text-color_weak">Select a CRM object above to configure its cards, lists, actions, and permissions.</p>
            </div>
        </template>
    </div>
</template>

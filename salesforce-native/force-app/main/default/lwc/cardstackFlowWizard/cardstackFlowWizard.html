<template>
    <div class="wizard">
        <div class="wizard-heading"><div><p class="eyebrow">FLOW LAUNCH CARD</p><h2>{stepTitle}</h2></div><lightning-button label="Cancel" onclick={cancel}></lightning-button></div>
        <template if:true={error}><p role="alert" class="slds-text-color_error slds-m-vertical_small">{error}</p></template>
        <template if:true={isStep1}>
            <p class="intro">Choose an active flow your team should open from chat. The flow runs in Salesforce.</p>
            <lightning-input type="search" label="Search Salesforce flows" placeholder="Search by flow name" value={flowSearch} onchange={handleFlowSearch}></lightning-input>
            <template if:true={flowLoadError}><p role="alert" class="slds-text-color_error">{flowLoadError}</p></template>
            <template if:true={flowsLoading}><lightning-spinner alternative-text="Loading Salesforce flows" size="small"></lightning-spinner></template>
            <template if:false={flowsLoading}>
                <template if:true={hasFlows}><ul class="flow-list"><template for:each={filteredFlows} for:item="f"><li key={f.apiName}><button class={f.rowClass} data-apiname={f.apiName} onclick={handlePickFlow}><lightning-icon icon-name="standard:flow" size="small"></lightning-icon><span class="flow-description"><strong>{f.label}</strong><span class="flow-api">{f.apiName}</span><span>{f.typeLabel}</span><template if:true={f.description}><span>{f.description}</span></template></span><template if:true={f.selected}><lightning-icon icon-name="utility:check" size="x-small" alternative-text="Selected"></lightning-icon></template></button></li></template></ul><template if:false={filteredFlows.length}><p class="empty">No flows match your search.</p></template></template>
                <template if:false={hasFlows}><p class="empty">No active screen or autolaunched flows are available. Activate a launchable flow in Salesforce Setup first.</p></template>
            </template>
            <div class="footer"><span>Choose flow → Review card → Publish</span><lightning-button label="Review card" variant="brand" onclick={goToReview} disabled={cannotContinue}></lightning-button></div>
        </template>
        <template if:true={isStep2}>
            <p class="intro">Give the card a name your team will recognize. Salesforce handles all flow screens and inputs after they open it.</p>
            <lightning-input label="Card name" value={flowLabel} onchange={handleLabelInput} required maxlength="120"></lightning-input>
            <p class="flow-api slds-m-top_x-small">Salesforce flow: {selectedFlow.apiName}</p>
            <div class="preview"><p class="eyebrow">CHAT CARD PREVIEW</p><div class="sample-card"><div class="card-heading"><lightning-icon icon-name="standard:flow" size="small"></lightning-icon><h3>{flowLabel}</h3></div><p>Ready to open for [record name].</p><p class="handoff">Complete this flow in Salesforce. Your Salesforce access and the flow’s own settings apply.</p><lightning-button label="Open in Salesforce" variant="brand" disabled></lightning-button></div><p class="preview-note">Preview only. Staging this card does not run the flow.</p></div>
            <div class="footer"><lightning-button label={backLabel} onclick={goBack}></lightning-button><lightning-button label="Stage launch card" variant="brand" onclick={stagePolicy} disabled={cannotStage}></lightning-button></div>
        </template>
    </div>
</template>

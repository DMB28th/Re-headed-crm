<template>
    <div class="flow-page">
        <template if:true={showWizard}><c-cardstack-flow-wizard initial-policy={initialPolicy} onwizarddone={handleWizardDone}></c-cardstack-flow-wizard></template>
        <template if:false={showWizard}>
            <div class="page-heading"><div><h2>Flow launch cards</h2><p>Give your team a clear card that opens a Salesforce flow from chat.</p></div><lightning-button label="Add launch card" variant="brand" icon-name="utility:add" onclick={openWizard}></lightning-button></div>
            <div class="handoff-note"><lightning-icon icon-name="utility:new_window" size="x-small"></lightning-icon><span><strong>Runs in Salesforce.</strong> Chat shows the launch card. Salesforce handles the flow’s screens, inputs, and record changes.</span></div>
            <template if:true={hasDraft}><div class="draft-notice"><p>{draftMessage}</p><lightning-button label="Open Publish Center" onclick={openPublish}></lightning-button></div></template>
            <template if:true={error}><p role="alert" class="slds-text-color_error slds-m-vertical_small">{error}</p></template>
            <template if:true={loading}><lightning-spinner alternative-text="Loading launch cards" size="small"></lightning-spinner></template>
            <template if:false={loading}>
                <template if:true={hasCards}>
                    <div class="list-toolbar"><lightning-input type="search" label="Search launch cards" value={search} onchange={handleSearch} placeholder="Search by card or flow name"></lightning-input><lightning-button label="Refresh" onclick={load}></lightning-button></div>
                    <ul class="card-list"><template for:each={flowRows} for:item="f"><li key={f.apiName} class="launch-card"><div class="card-title"><lightning-icon icon-name="standard:flow" size="small"></lightning-icon><div><h3>{f.label}</h3><p class="flow-api">{f.apiName}</p></div><lightning-badge label={f.status} class={f.statusClass}></lightning-badge></div><p>{f.availability}</p><p class="card-behavior">Open in Salesforce · Record context included</p><div class="card-actions"><lightning-button label="Edit card" data-api={f.apiName} onclick={editCard}></lightning-button><lightning-button label="Remove card" data-api={f.apiName} onclick={removeCard}></lightning-button></div></li></template></ul>
                    <template if:false={flowRows.length}><p class="empty-search">No launch cards match your search.</p></template>
                </template>
                <template if:false={hasCards}><div class="empty-state"><lightning-icon icon-name="standard:flow" size="large"></lightning-icon><h3>Add your first flow launch card</h3><p>Choose an active Salesforce flow, give its card a clear name, then review and stage it for publishing.</p><lightning-button label="Add launch card" variant="brand" onclick={openWizard}></lightning-button></div></template>
            </template>
        </template>
    </div>
</template>
